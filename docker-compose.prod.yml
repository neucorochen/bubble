services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: commune-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/commune
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: 1

      REALTIME_URL: http://realtime:4100
      REALTIME_SECRET: ${REALTIME_SECRET:?Set REALTIME_SECRET in .env.production}

      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env.production}
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env.production}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.production}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env.production}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env.production}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    image: commune-realtime:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.production}
      REALTIME_SECRET: ${REALTIME_SECRET:?Set REALTIME_SECRET in .env.production}
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: commune-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

volumes:
  mongo-prod-data:

networks:
  backend:
    driver: bridge
