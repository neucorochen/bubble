services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bubble}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bubble-local-dev-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    command: server /bitnami/minio/data --console-address ":9001"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/commune
      UPLOAD_DIR: /data/uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  uploads-data:
  minio-data:
