<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Bubble — открытая платформа сообществ</title>
    <meta
      name="description"
      content="Bubble — открытая платформа сообществ. Публикуйте записи, подписывайтесь и общайтесь."
    />
    <meta name="application-name" content="Bubble" />

    <!-- Browser UI colours follow the user's light or dark setting. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)" />

    <!-- Google Adsense Implementation -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7015477982506060"
      crossorigin="anonymous"
    ></script>

    <!-- Icons and installable web app (PWA) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bubble" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Link previews. Add og:image (an absolute https URL to a 1200x630 image) once you have one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bubble" />
    <meta property="og:title" content="Bubble" />
    <meta
      property="og:description"
      content="An open source community platform. Share posts, follow people and join the conversation."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://commune-mu.vercel.app/" />
    <meta property="og:url" content="https://commune-mu.vercel.app/" />

    <!-- Aero fallback remains visible until React replaces #root. -->
    <style>
      html, body { margin: 0; background: #e4f3fc; color: #123b60; }
      #root > .boot-header, #root > .boot-body { box-sizing: border-box; width: min(100% - 24px, 1104px); margin-inline: auto; font-family: "Segoe UI", system-ui, sans-serif; }
      #root > .boot-header { margin-top: 16px; padding: 15px 20px; color: white; font-size: 1.2rem; font-weight: 700; background: linear-gradient(#19beef, #0076c8 49%, #0056a6 51%, #008ed0); border: 1px solid #297cb8; border-radius: 8px 8px 0 0; }
      #root > .boot-body { min-height: 200px; padding: 24px; background: linear-gradient(135deg, #f8fdff, #d7effc); border: 1px solid #8bbbd7; border-top: 0; }
      #root > .boot-body h1 { margin: 0 0 8px; font-size: 1.4rem; }
    </style>

    <!--
      Start the requests the first screen needs right now, in parallel with downloading the
      app, instead of after it has started. The app takes each response over exactly once
      (see takeEarly in src/lib/api.ts). Skipped on localhost, where the API is elsewhere.
    -->
    <script>
      (function () {
        try {
          var h = location.hostname;
          if (h === "localhost" || h === "127.0.0.1") return;
          var early = (window.__early = {});
          var start = function (key, url, init) {
            var p = fetch(url, init);
            p.catch(function () {});
            early[key] = p;
          };
          var hint = localStorage.getItem("commune_session");
          var path = location.pathname;
          start("/news?topic=top", "/api/news?topic=top");
          if (hint !== "guest")
            start("/auth/refresh", "/api/auth/refresh", { method: "POST", credentials: "include" });
          else if (path === "/" || path === "/explore") start("/public/posts", "/api/public/posts");
        } catch (e) {}
      })();
    </script>

    <!-- Google Analytics tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T3YEFKZP7Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-T3YEFKZP7Q");
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-header">Bubble</div>
      <div class="boot-body">
        <h1>Bubble</h1>
        <p>
          Открытая платформа сообществ. Публикуйте записи, подписывайтесь, вступайте в сообщества и читайте новости.
        </p>
      </div>
    </div>
    <noscript>Для работы Bubble включите JavaScript в настройках браузера.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
