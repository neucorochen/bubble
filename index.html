<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble — Убежище от интернета</title>
  <link rel="stylesheet" href="https://unpkg.com/xp.css/dist/XP.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #004e98 url('https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png') no-repeat center center fixed;
      background-size: cover;
      font-family: "Tahoma", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .desktop {
      flex: 1;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .auth-window {
      width: 340px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }
    .ie-window {
      width: 900px;
      max-width: 98vw;
      height: 670px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
    }
    .address-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      background: #ece9d8;
      border-bottom: 1px solid #aca899;
      font-size: 11px;
    }
    .address-bar input { flex: 1; font-size: 11px; }
    .window-body-layout {
      flex: 1;
      display: flex;
      background: #fff;
      overflow: hidden;
      margin: 0 !important;
      padding: 0 !important;
    }
    .sidebar {
      width: 170px;
      background: #ece9d8;
      border-right: 2px groove #fff;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar button {
      width: 100%;
      text-align: left;
      font-size: 11px;
    }
    .main-view {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .post-box {
      background: #fbfbfb;
      border: 1px solid #7f9db9;
      padding: 8px 12px;
      margin-bottom: 12px;
    }
    .post-author {
      font-weight: bold;
      color: #0b388f;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .post-image {
      max-width: 100%;
      max-height: 350px;
      display: block;
      margin: 8px 0;
      border: 1px solid #aca899;
    }
    .post-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed #dcdcdc;
    }
    .comments-section {
      margin-top: 8px;
      background: #f0f0f0;
      padding: 6px 10px;
      border-left: 2px solid #0055ea;
    }
    .comment-item {
      font-size: 11px;
      margin-bottom: 4px;
      border-bottom: 1px dotted #ccc;
      padding-bottom: 2px;
    }
    .comment-item b {
      color: #2b579a;
    }
    .taskbar {
      height: 30px;
      background: linear-gradient(to bottom, #245edb 0%, #3f8cf3 9%, #245edb 18%, #1941a5 92%, #1941a5 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .start-button {
      height: 100%;
      background: linear-gradient(to bottom, #388e3c 0%, #4caf50 10%, #2e7d32 100%);
      border: none;
      color: white;
      font-weight: bold;
      font-style: italic;
      padding: 0 14px;
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      cursor: pointer;
    }
    .tray {
      background: #0f8fee;
      height: 100%;
      padding: 0 12px;
      display: flex;
      align-items: center;
      color: white;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- Окно входа / регистрации -->
  <div class="modal-overlay" id="authModal">
    <div class="window auth-window">
      <div class="title-bar">
        <div class="title-bar-text">Bubble — Вход / Регистрация</div>
      </div>
      <div class="window-body">
        <div style="margin-bottom: 6px;">
          <label style="display:block; font-size:11px;">Никнейм:</label>
          <input type="text" id="inputUsername" placeholder="BubbleUser" style="width: 100%; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 6px;">
          <label style="display:block; font-size:11px;">Электронная почта:</label>
          <input type="email" id="inputEmail" placeholder="user@mail.com" style="width: 100%; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 10px;">
          <label style="display:block; font-size:11px;">Пароль (от 6 символов):</label>
          <input type="password" id="inputPass" placeholder="******" style="width: 100%; box-sizing: border-box;">
        </div>
        <div style="display: flex; justify-content: space-between;">
          <button id="btnActionLogin" type="button" style="font-weight: bold;">Войти</button>
          <button id="btnActionRegister" type="button">Регистрация</button>
        </div>
        <div id="authStatus" style="color:red; font-size:11px; margin-top:8px; min-height: 14px;"></div>
      </div>
    </div>
  </div>

  <!-- Главное окно сайта -->
  <div class="desktop">
    <div class="window ie-window">
      <div class="title-bar">
        <div class="title-bar-text">Bubble — Убежище от интернета — Microsoft Internet Explorer</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>

      <div class="address-bar">
        <span>Address:</span>
        <input type="text" value="https://bubble.net/feed/all" readonly>
        <button style="min-width: 40px;">Go</button>
      </div>

      <div class="window-body window-body-layout">
        <div class="sidebar">
          <fieldset style="padding: 4px; margin-bottom: 6px;">
            <legend>Мой профиль</legend>
            <div id="userDisplay" style="font-weight: bold; font-size: 11px; margin-bottom: 4px; color: #000080;">...</div>
            <button id="btnLogout" type="button">Выйти</button>
          </fieldset>
          <button style="font-weight: bold;">📰 Общая лента</button>
        </div>

        <div class="main-view">
          <!-- Форма создания нового поста с картинкой -->
          <fieldset style="margin-bottom: 12px;">
            <legend>Новая запись на стену</legend>
            <textarea id="postContent" rows="3" style="width: 100%; box-sizing: border-box;" placeholder="Что нового в Bubble?"></textarea>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
              <div>
                <label style="font-size: 11px; cursor: pointer;">
                  📷 Прикрепить фото:
                  <input type="file" id="postImageFile" accept="image/*" style="font-size: 11px;">
                </label>
              </div>
              <button id="btnCreatePost" type="button" style="font-weight: bold;">Опубликовать</button>
            </div>
            <div id="uploadStatus" style="font-size: 10px; color: #444; margin-top: 2px;"></div>
          </fieldset>

          <fieldset>
            <legend>Общая лента записей Bubble</legend>
            <div id="feedList">Загрузка постов...</div>
          </fieldset>
        </div>
      </div>
    </div>
  </div>

  <div class="taskbar">
    <button class="start-button">start</button>
    <div class="tray" id="clock">12:00</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gcebeebtccfzmpflztee.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dtbIcBYG7yK2hbB-8a8tGw_9ceJUZ0X';
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeUser = null;
    let userLikedPosts = new Set();

    const authModal = document.getElementById('authModal');
    const authStatus = document.getElementById('authStatus');
    const inputUsername = document.getElementById('inputUsername');
    const inputEmail = document.getElementById('inputEmail');
    const inputPass = document.getElementById('inputPass');
    const userDisplay = document.getElementById('userDisplay');
    const feedList = document.getElementById('feedList');
    const postContent = document.getElementById('postContent');
    const postImageFile = document.getElementById('postImageFile');
    const btnCreatePost = document.getElementById('btnCreatePost');
    const uploadStatus = document.getElementById('uploadStatus');

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    function getUserName(user) {
      if (!user) return 'Аноним';
      return user.user_metadata?.username || user.email.split('@')[0];
    }

    async function updateSessionState(session) {
      activeUser = session ? session.user : null;
      if (activeUser) {
        authModal.style.display = 'none';
        userDisplay.innerText = getUserName(activeUser);
        await loadUserLikes();
        loadFeed();
      } else {
        authModal.style.display = 'flex';
      }
    }

    sbClient.auth.getSession().then(({ data: { session } }) => updateSessionState(session));
    sbClient.auth.onAuthStateChange((_, session) => updateSessionState(session));

    // Авторизация
    document.getElementById('btnActionRegister').addEventListener('click', async () => {
      authStatus.style.color = '#333';
      authStatus.innerText = 'Создание аккаунта...';

      const username = inputUsername.value.trim();
      const email = inputEmail.value.trim();
      const password = inputPass.value.trim();

      if (!username || !email || !password) {
        authStatus.style.color = 'red';
        authStatus.innerText = 'Заполните все поля!';
        return;
      }
      if (password.length < 6) {
        authStatus.style.color = 'red';
        authStatus.innerText = 'Пароль от 6 символов!';
        return;
      }

      const { data, error } = await sbClient.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      if (error) {
        authStatus.style.color = 'red';
        authStatus.innerText = error.message;
      } else if (data.session) {
        updateSessionState(data.session);
      } else {
        authStatus.style.color = 'green';
        authStatus.innerText = 'Создано! Нажмите «Войти».';
      }
    });

    document.getElementById('btnActionLogin').addEventListener('click', async () => {
      authStatus.style.color = '#333';
      authStatus.innerText = 'Проверка...';
      const email = inputEmail.value.trim();
      const password = inputPass.value.trim();

      if (!email || !password) return authStatus.innerText = 'Введите почту и пароль!';

      const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
      if (error) {
        authStatus.style.color = 'red';
        authStatus.innerText = error.message;
      } else {
        updateSessionState(data.session);
      }
    });

    document.getElementById('btnLogout').addEventListener('click', () => sbClient.auth.signOut());

    // Загрузка лайков текущего пользователя
    async function loadUserLikes() {
      if (!activeUser) return;
      const { data } = await sbClient
        .from('post_likes')
        .select('post_id')
        .eq('user_id', activeUser.id);

      userLikedPosts = new Set((data || []).map(l => l.post_id));
    }

    // Загрузка ленты, лайков и комментариев
    async function loadFeed() {
      if (!activeUser) return;
      feedList.innerHTML = 'Загрузка записей Bubble...';

      // Получаем посты
      const { data: posts, error } = await sbClient
        .from('posts')
        .select('*')
        .order('id', { ascending: false })
        .limit(30);

      if (error) {
        feedList.innerHTML = '<p style="color:red">Ошибка: ' + error.message + '</p>';
        return;
      }

      if (!posts || posts.length === 0) {
        feedList.innerHTML = '<p>Пока нет записей. Оставьте первое сообщение!</p>';
        return;
      }

      // Получаем комментарии ко всем загруженным постам
      const postIds = posts.map(p => p.id);
      const { data: comments } = await sbClient
        .from('comments')
        .select('*')
        .in('post_id', postIds)
        .order('id', { ascending: true });

      const commentsByPost = {};
      (comments || []).forEach(c => {
        if (!commentsByPost[c.post_id]) commentsByPost[c.post_id] = [];
        commentsByPost[c.post_id].push(c);
      });

      feedList.innerHTML = posts.map(p => {
        const isLiked = userLikedPosts.has(p.id);
        const postComments = commentsByPost[p.id] || [];

        return `
          <div class="post-box" id="post-${p.id}">
            <div class="post-author">
              <span>🫧 ${escapeHtml(p.author)}</span>
              <span style="font-size:10px; color:#777;">${new Date(p.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
            <div>${escapeHtml(p.content)}</div>
            ${p.image_url ? `<img src="${p.image_url}" class="post-image" alt="Вложение">` : ''}

            <!-- Лайки и кнопка комментариев -->
            <div class="post-actions">
              <button onclick="toggleLike(${p.id}, ${p.likes_count || 0})">
                ${isLiked ? '❤️' : '🤍'} ${p.likes_count || 0}
              </button>
              <span style="font-size:11px; color:#555;">💬 Комментариев: ${postComments.length}</span>
            </div>

            <!-- Блок комментариев -->
            <div class="comments-section">
              <div id="comments-list-${p.id}">
                ${postComments.map(c => `
                  <div class="comment-item">
                    <b>${escapeHtml(c.author)}:</b> ${escapeHtml(c.content)}
                  </div>
                `).join('')}
              </div>
              <div style="display:flex; gap:4px; margin-top:6px;">
                <input type="text" id="comment-input-${p.id}" placeholder="Написать комментарий..." style="flex:1; font-size:11px;">
                <button onclick="sendComment(${p.id})" style="font-size:11px;">Ответить</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Создание поста с картинкой
    btnCreatePost.addEventListener('click', async () => {
      const text = postContent.value.trim();
      const file = postImageFile.files[0];

      if (!text && !file) return alert('Введите текст или прикрепите изображение!');
      if (!activeUser) return;

      btnCreatePost.disabled = true;
      let imageUrl = null;

      // Если прикреплен файл — загружаем в Storage
      if (file) {
        uploadStatus.innerText = 'Загрузка изображения...';
        const fileExt = file.name.split('.').pop();
        const fileName = `${activeUser.id}_${Date.now()}.${fileExt}`;

        const { error: uploadError } = await sbClient.storage
          .from('post_images')
          .upload(fileName, file);

        if (uploadError) {
          uploadStatus.innerText = '';
          btnCreatePost.disabled = false;
          return alert('Ошибка при загрузке картинки: ' + uploadError.message);
        }

        const { data: { publicUrl } } = sbClient.storage
          .from('post_images')
          .getPublicUrl(fileName);

        imageUrl = publicUrl;
      }

      uploadStatus.innerText = 'Публикация записи...';
      const myNick = getUserName(activeUser);

      const { error } = await sbClient.from('posts').insert([{
        author: myNick,
        content: text,
        user_id: activeUser.id,
        image_url: imageUrl,
        likes_count: 0
      }]);

      btnCreatePost.disabled = false;
      uploadStatus.innerText = '';

      if (error) {
        alert('Ошибка публикации: ' + error.message);
      } else {
        postContent.value = '';
        postImageFile.value = '';
        loadFeed();
      }
    });

    // Функция переключения лайка
    window.toggleLike = async function(postId, currentLikes) {
      if (!activeUser) return;

      if (userLikedPosts.has(postId)) {
        // Убираем лайк
        await sbClient.from('post_likes').delete().match({ post_id: postId, user_id: activeUser.id });
        await sbClient.from('posts').update({ likes_count: Math.max(0, currentLikes - 1) }).eq('id', postId);
        userLikedPosts.delete(postId);
      } else {
        // Ставим лайк
        await sbClient.from('post_likes').insert([{ post_id: postId, user_id: activeUser.id }]);
        await sbClient.from('posts').update({ likes_count: currentLikes + 1 }).eq('id', postId);
        userLikedPosts.add(postId);
      }

      loadFeed();
    };

    // Функция добавления комментария
    window.sendComment = async function(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input.value.trim();
      if (!text || !activeUser) return;

      const myNick = getUserName(activeUser);

      const { error } = await sbClient.from('comments').insert([{
        post_id: postId,
        user_id: activeUser.id,
        author: myNick,
        content: text
      }]);

      if (error) {
        alert('Ошибка комментария: ' + error.message);
      } else {
        input.value = '';
        loadFeed();
      }
    };

    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);
  </script>
</body>
</html>
