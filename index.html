<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стрекоза — Социальная сеть в стиле Windows XP</title>
  <!-- Стили Windows XP -->
  <link rel="stylesheet" href="https://unpkg.com/xp.css/dist/XP.css">
  <!-- Клиентская библиотека Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #004e98 url('https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png') no-repeat center center fixed;
      background-size: cover;
      font-family: "Tahoma", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .desktop {
      flex: 1;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .ie-window {
      width: 900px;
      max-width: 96vw;
      height: 650px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
    }
    .ie-toolbar, .address-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: #ece9d8;
      border-bottom: 1px solid #aca899;
      font-size: 11px;
    }
    .address-bar input {
      flex: 1;
      font-size: 11px;
    }
    .window-body-scroll {
      flex: 1;
      overflow-y: auto;
      background: #fff;
      padding: 14px;
      margin: 0 !important;
    }
    .post-box {
      background: #fbfbfb;
      border: 1px solid #7f9db9;
      padding: 8px 12px;
      margin-bottom: 10px;
    }
    .post-author {
      font-weight: bold;
      color: #0b388f;
      margin-bottom: 4px;
    }
    .post-time {
      font-size: 10px;
      color: #777;
    }
    .track-item {
      border-bottom: 1px dotted #ccc;
      padding: 8px 0;
    }
    .taskbar {
      height: 30px;
      background: linear-gradient(to bottom, #245edb 0%, #3f8cf3 9%, #245edb 18%, #1941a5 92%, #1941a5 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .start-button {
      height: 100%;
      background: linear-gradient(to bottom, #388e3c 0%, #4caf50 10%, #2e7d32 100%);
      border: none;
      color: white;
      font-weight: bold;
      font-style: italic;
      font-size: 14px;
      padding: 0 14px;
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      cursor: pointer;
    }
    .tray {
      background: #0f8fee;
      height: 100%;
      padding: 0 12px;
      display: flex;
      align-items: center;
      color: white;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="desktop">
    <div class="window ie-window">
      <div class="title-bar">
        <div class="title-bar-text">Стрекоза — Убежище от интернета — Microsoft Internet Explorer</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>

      <div class="ie-toolbar">
        <span><u>F</u>ile</span>
        <span><u>E</u>dit</span>
        <span><u>V</u>iew</span>
        <span><u>F</u>avorites</span>
        <span><u>T</u>ools</span>
        <span><u>H</u>elp</span>
      </div>

      <div class="address-bar">
        <span>Address:</span>
        <input type="text" value="https://dragonfly-flash.com/wall" readonly>
        <button style="min-width: 40px;">Go</button>
      </div>

      <div class="window-body window-body-scroll">
        <!-- Блок авторизации -->
        <fieldset style="margin-bottom: 12px;">
          <legend>Учётная запись</legend>
          
          <div id="authSection">
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
              <input type="email" id="emailInput" placeholder="Email" style="flex: 1;">
              <input type="password" id="passInput" placeholder="Пароль (от 6 символов)" style="flex: 1;">
            </div>
            <div style="display: flex; gap: 8px;">
              <button id="loginBtn" style="font-weight: bold;">Войти</button>
              <button id="registerBtn">Регистрация</button>
            </div>
          </div>

          <div id="userSection" style="display: none; justify-content: space-between; align-items: center;">
            <div>Вы вошли как: <b id="userEmail"></b></div>
            <button id="logoutBtn">Выйти</button>
          </div>
        </fieldset>

        <!-- Блок аудиозаписей -->
        <fieldset style="margin-bottom: 12px;">
          <legend>Аудиозаписи</legend>
          
          <div id="uploadSection" style="display: none; padding-bottom: 10px; border-bottom: 1px solid #aca899; margin-bottom: 10px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
              <input type="text" id="trackArtist" placeholder="Исполнитель">
              <input type="text" id="trackTitle" placeholder="Название трека">
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
              <input type="file" id="audioFile" accept="audio/mp3,audio/mpeg">
              <button id="uploadBtn">Загрузить MP3</button>
            </div>
            <div id="uploadStatus" style="font-size: 11px; color: #555; margin-top: 4px;"></div>
          </div>

          <div id="tracksList">Загрузка треков...</div>
        </fieldset>

        <!-- Блок стены и постов -->
        <fieldset style="margin-bottom: 12px;">
          <legend>Оставить запись на стене</legend>
          <div style="display: flex; gap: 8px; margin-bottom: 6px;">
            <input type="text" id="authorInput" placeholder="Ваш ник" style="width: 160px;" value="Стрекозоид">
          </div>
          <textarea id="contentInput" rows="3" style="width: 100%; box-sizing: border-box;" placeholder="Что нового?"></textarea>
          <div style="text-align: right; margin-top: 6px;">
            <button id="sendBtn" style="font-weight: bold;">Опубликовать</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Стена сообщества</legend>
          <div id="postsFeed">Загрузка записей...</div>
        </fieldset>
      </div>
    </div>
  </div>

  <div class="taskbar">
    <button class="start-button">start</button>
    <div class="tray" id="clock">12:00</div>
  </div>

  <script>
    // -------------------------------------------------------------
    // ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ SUPABASE:
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://gcebeebtccfzmpflztee.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_dtbIcBYG7yK2hbB-8a8tGw_9ceJUZ0X';
    // -------------------------------------------------------------

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM-элементы
    const authSection = document.getElementById('authSection');
    const userSection = document.getElementById('userSection');
    const userEmail = document.getElementById('userEmail');
    const emailInput = document.getElementById('emailInput');
    const passInput = document.getElementById('passInput');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    const uploadSection = document.getElementById('uploadSection');
    const trackArtist = document.getElementById('trackArtist');
    const trackTitle = document.getElementById('trackTitle');
    const audioFile = document.getElementById('audioFile');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const tracksList = document.getElementById('tracksList');

    const postsFeed = document.getElementById('postsFeed');
    const authorInput = document.getElementById('authorInput');
    const contentInput = document.getElementById('contentInput');
    const sendBtn = document.getElementById('sendBtn');

    let currentUser = null;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // --- 1. АВТОРИЗАЦИЯ ---
    supabase.auth.onAuthStateChange((event, session) => {
      currentUser = session ? session.user : null;
      if (currentUser) {
        authSection.style.display = 'none';
        userSection.style.display = 'flex';
        userEmail.innerText = currentUser.email;
        uploadSection.style.display = 'block';
        authorInput.value = currentUser.email.split('@')[0];
      } else {
        authSection.style.display = 'block';
        userSection.style.display = 'none';
        uploadSection.style.display = 'none';
        authorInput.value = 'Стрекозоид';
      }
    });

    registerBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passInput.value.trim();
      if (!email || !password) return alert('Введите email и пароль');

      const { error } = await supabase.auth.signUp({ email, password });
      if (error) alert('Ошибка регистрации: ' + error.message);
      else alert('Успешная регистрация!');
    });

    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passInput.value.trim();
      if (!email || !password) return alert('Введите email и пароль');

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert('Ошибка входа: ' + error.message);
    });

    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    // --- 2. СТЕНА И ПОСТЫ ---
    function renderPosts(posts) {
      if (!posts || posts.length === 0) {
        postsFeed.innerHTML = '<p>Записей пока нет. Будьте первым!</p>';
        return;
      }
      postsFeed.innerHTML = posts.map(post => `
        <div class="post-box">
          <div class="post-author">${escapeHtml(post.author)} <span class="post-time">${new Date(post.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>
          <div>${escapeHtml(post.content)}</div>
        </div>
      `).join('');
    }

    async function loadPosts() {
      const { data, error } = await supabase
        .from('posts')
        .select('*')
        .order('id', { ascending: false })
        .limit(30);

      if (error) {
        postsFeed.innerHTML = '<p style="color:red">Ошибка загрузки: ' + error.message + '</p>';
      } else {
        renderPosts(data);
      }
    }

    sendBtn.addEventListener('click', async () => {
      const content = contentInput.value.trim();
      const author = authorInput.value.trim() || 'Аноним';
      if (!content) return;

      sendBtn.disabled = true;
      const { error } = await supabase.from('posts').insert([{ author, content }]);
      sendBtn.disabled = false;

      if (error) {
        alert('Ошибка при публикации: ' + error.message);
      } else {
        contentInput.value = '';
        loadPosts();
      }
    });

    // --- 3. АУДИОЗАПИСИ И ЗАГРУЗКА В STORAGE ---
    async function loadTracks() {
      const { data: tracks, error } = await supabase
        .from('tracks')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        tracksList.innerHTML = '<p style="color:red">Ошибка загрузки аудио: ' + error.message + '</p>';
        return;
      }

      if (!tracks || tracks.length === 0) {
        tracksList.innerHTML = '<p>Аудиозаписей пока нет.</p>';
        return;
      }

      tracksList.innerHTML = tracks.map(track => `
        <div class="track-item">
          <div><b>${escapeHtml(track.artist)}</b> — ${escapeHtml(track.title)}</div>
          <audio controls style="width: 100%; height: 28px; margin-top: 4px;">
            <source src="${track.audio_url}" type="audio/mpeg">
            Ваш браузер не воспроизводит аудио.
          </audio>
        </div>
      `).join('');
    }

    uploadBtn.addEventListener('click', async () => {
      const file = audioFile.files[0];
      const artist = trackArtist.value.trim() || 'Неизвестный исполнитель';
      const title = trackTitle.value.trim() || 'Без названия';

      if (!file) return alert('Выберите файл MP3');
      uploadBtn.disabled = true;
      uploadStatus.innerText = 'Загрузка файла в хранилище...';

      const fileExt = file.name.split('.').pop();
      const filePath = `${currentUser.id}/${Date.now()}.${fileExt}`;

      const { error: uploadError } = await supabase.storage
        .from('audio')
        .upload(filePath, file);

      if (uploadError) {
        uploadStatus.innerText = '';
        uploadBtn.disabled = false;
        return alert('Ошибка загрузки: ' + uploadError.message);
      }

      const { data: { publicUrl } } = supabase.storage
        .from('audio')
        .getPublicUrl(filePath);

      const { error: dbError } = await supabase.from('tracks').insert([{
        title,
        artist,
        audio_url: publicUrl,
        user_id: currentUser.id
      }]);

      uploadBtn.disabled = false;
      uploadStatus.innerText = '';

      if (dbError) {
        alert('Ошибка сохранения записи: ' + dbError.message);
      } else {
        trackArtist.value = '';
        trackTitle.value = '';
        audioFile.value = '';
        loadTracks();
      }
    });

    // --- 4. REALTIME СИНХРОНИЗАЦИЯ ПОСТОВ ---
    supabase
      .channel('schema-db-changes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, () => {
        loadPosts();
      })
      .subscribe();

    // Часы в трее
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Запуск при старте страницы
    loadPosts();
    loadTracks();
  </script>
</body>
</html>
