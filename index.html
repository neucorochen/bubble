<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стрекоза — Социальная сеть Windows XP</title>
  <link rel="stylesheet" href="https://unpkg.com/xp.css/dist/XP.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #004e98 url('https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png') no-repeat center center fixed;
      background-size: cover;
      font-family: "Tahoma", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .desktop {
      flex: 1;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .ie-window {
      width: 960px;
      max-width: 98vw;
      height: 680px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .address-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      background: #ece9d8;
      border-bottom: 1px solid #aca899;
      font-size: 11px;
    }
    .address-bar input { flex: 1; font-size: 11px; }
    
    .window-body-layout {
      flex: 1;
      display: flex;
      background: #fff;
      overflow: hidden;
      margin: 0 !important;
      padding: 0 !important;
    }
    .sidebar {
      width: 170px;
      background: #ece9d8;
      border-right: 2px groove #fff;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar button {
      width: 100%;
      text-align: left;
      font-size: 11px;
    }
    .main-view {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .auth-window {
      width: 320px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    .post-box {
      background: #fbfbfb;
      border: 1px solid #7f9db9;
      padding: 8px 12px;
      margin-bottom: 8px;
    }
    .post-author {
      font-weight: bold;
      color: #0b388f;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .chat-container {
      display: flex;
      height: 100%;
      border: 1px solid #7f9db9;
    }
    .chat-users {
      width: 140px;
      border-right: 1px solid #7f9db9;
      background: #fbfbfb;
      overflow-y: auto;
      padding: 4px;
    }
    .chat-user-btn {
      width: 100%;
      text-align: left;
      margin-bottom: 4px;
      font-size: 11px;
      padding: 2px 4px;
    }
    .chat-messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .chat-msg {
      margin-bottom: 6px;
      font-size: 12px;
    }

    .taskbar {
      height: 30px;
      background: linear-gradient(to bottom, #245edb 0%, #3f8cf3 9%, #245edb 18%, #1941a5 92%, #1941a5 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .start-button {
      height: 100%;
      background: linear-gradient(to bottom, #388e3c 0%, #4caf50 10%, #2e7d32 100%);
      border: none;
      color: white;
      font-weight: bold;
      font-style: italic;
      padding: 0 14px;
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      cursor: pointer;
    }
    .tray {
      background: #0f8fee;
      height: 100%;
      padding: 0 12px;
      display: flex;
      align-items: center;
      color: white;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- Окно авторизации/регистрации -->
  <div class="modal-overlay" id="authModal">
    <div class="window auth-window">
      <div class="title-bar">
        <div class="title-bar-text">Вход в сеть «Стрекоза»</div>
      </div>
      <div class="window-body">
        <p style="margin-top:0;">Для входа укажите ваш email и пароль:</p>
        <div style="margin-bottom: 6px;">
          <label style="display:block; font-size:11px;">Email:</label>
          <input type="email" id="authEmail" placeholder="user@mail.com" style="width: 100%; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 10px;">
          <label style="display:block; font-size:11px;">Пароль (от 6 символов):</label>
          <input type="password" id="authPass" placeholder="******" style="width: 100%; box-sizing: border-box;">
        </div>
        <div style="display: flex; justify-content: space-between;">
          <button id="authLoginBtn" type="button" style="font-weight: bold;">Войти</button>
          <button id="authRegisterBtn" type="button">Регистрация</button>
        </div>
        <div id="authError" style="color:red; font-size:11px; margin-top:8px; min-height: 14px;"></div>
      </div>
    </div>
  </div>

  <!-- Главное окно -->
  <div class="desktop">
    <div class="window ie-window">
      <div class="title-bar">
        <div class="title-bar-text">Стрекоза — Убежище от интернета — Microsoft Internet Explorer</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>

      <div class="address-bar">
        <span>Address:</span>
        <input type="text" id="urlDisplay" value="https://dragonfly-flash.com/feed/all" readonly>
        <button style="min-width: 40px;">Go</button>
      </div>

      <div class="window-body window-body-layout">
        <!-- Меню слева -->
        <div class="sidebar">
          <fieldset style="padding: 4px; margin-bottom: 6px;">
            <legend>Профиль</legend>
            <div id="sideUserName" style="font-weight: bold; font-size: 11px; margin-bottom: 4px;">...</div>
            <button id="logoutBtn" type="button">Выход</button>
          </fieldset>

          <button id="tabFeedAll" type="button" style="font-weight: bold;">📰 Общая лента</button>
          <button id="tabFeedFriends" type="button">👥 Лента друзей</button>
          <button id="tabFeedGroups" type="button">🏛 Сообщества</button>
          <button id="tabChats" type="button">💬 Личные чаты</button>
        </div>

        <!-- Центральная область -->
        <div class="main-view" id="mainView">
          <div id="feedSection">
            <fieldset style="margin-bottom: 12px;">
              <legend>Новая запись</legend>
              <textarea id="postText" rows="2" style="width: 100%; box-sizing: border-box;" placeholder="Написать на стену..."></textarea>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                <label style="font-size: 11px;">
                  <input type="checkbox" id="postIsGroup"> Запись сообщества
                </label>
                <button id="sendPostBtn" type="button">Опубликовать</button>
              </div>
            </fieldset>

            <fieldset>
              <legend id="feedTitle">Общая хроника</legend>
              <div id="feedList">Загрузка постов...</div>
            </fieldset>
          </div>

          <div id="chatSection" style="display: none; height: 100%;">
            <div class="chat-container">
              <div class="chat-users" id="chatUsersList">
                <div style="font-weight: bold; font-size: 11px; margin-bottom: 4px;">Собеседники:</div>
                <div id="usersList">Загрузка...</div>
              </div>
              <div class="chat-messages">
                <div style="background: #ece9d8; padding: 4px 8px; font-size: 11px; border-bottom: 1px solid #aca899;" id="currentChatTitle">
                  Выберите пользователя для диалога
                </div>
                <div class="chat-history" id="chatHistory"></div>
                <div style="display: flex; gap: 4px; padding: 6px; background: #ece9d8; border-top: 1px solid #aca899;">
                  <input type="text" id="chatInput" placeholder="Напишите сообщение..." style="flex:1;">
                  <button id="sendChatBtn" type="button">Отправить</button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="taskbar">
    <button class="start-button">start</button>
    <div class="tray" id="clock">12:00</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gcebeebtccfzmpflztee.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dtbIcBYG7yK2hbB-8a8tGw_9ceJUZ0X';

    // Используем уникальное имя клиента sbClient во избежание конфликта
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentTab = 'all';
    let activeChatUserId = null;

    const authModal = document.getElementById('authModal');
    const authEmail = document.getElementById('authEmail');
    const authPass = document.getElementById('authPass');
    const authError = document.getElementById('authError');
    const sideUserName = document.getElementById('sideUserName');
    const urlDisplay = document.getElementById('urlDisplay');

    const feedSection = document.getElementById('feedSection');
    const chatSection = document.getElementById('chatSection');
    const feedTitle = document.getElementById('feedTitle');
    const feedList = document.getElementById('feedList');
    const postText = document.getElementById('postText');
    const postIsGroup = document.getElementById('postIsGroup');

    function handleUserSession(session) {
      currentUser = session ? session.user : null;
      if (currentUser) {
        authModal.style.display = 'none';
        sideUserName.innerText = currentUser.email.split('@')[0];
        loadFeed();
      } else {
        authModal.style.display = 'flex';
      }
    }

    sbClient.auth.getSession().then(({ data: { session } }) => {
      handleUserSession(session);
    });

    sbClient.auth.onAuthStateChange((event, session) => {
      handleUserSession(session);
    });

    // Регистрация
    document.getElementById('authRegisterBtn').addEventListener('click', async () => {
      authError.style.color = '#333';
      authError.innerText = 'Отправка данных...';

      const email = authEmail.value.trim();
      const password = authPass.value.trim();

      if (!email || !password) {
        authError.style.color = 'red';
        authError.innerText = 'Введите email и пароль!';
        return;
      }
      if (password.length < 6) {
        authError.style.color = 'red';
        authError.innerText = 'Пароль должен быть от 6 знаков!';
        return;
      }

      try {
        const { data, error } = await sbClient.auth.signUp({ email, password });
        if (error) {
          authError.style.color = 'red';
          authError.innerText = error.message;
        } else if (data?.user && !data?.session) {
          authError.style.color = 'green';
          authError.innerText = 'Письмо отправлено! Подтвердите почту (или отключите Confirm email в Supabase).';
        } else {
          authError.style.color = 'green';
          authError.innerText = 'Успешно! Выполняется вход...';
        }
      } catch (err) {
        authError.style.color = 'red';
        authError.innerText = 'Сбой сети: ' + err.message;
      }
    });

    // Вход
    document.getElementById('authLoginBtn').addEventListener('click', async () => {
      authError.style.color = '#333';
      authError.innerText = 'Проверка данных...';

      const email = authEmail.value.trim();
      const password = authPass.value.trim();

      if (!email || !password) {
        authError.style.color = 'red';
        authError.innerText = 'Введите email и пароль!';
        return;
      }

      try {
        const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
        if (error) {
          authError.style.color = 'red';
          authError.innerText = error.message;
        } else {
          authError.style.color = 'green';
          authError.innerText = 'Успешно!';
        }
      } catch (err) {
        authError.style.color = 'red';
        authError.innerText = 'Сбой сети: ' + err.message;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sbClient.auth.signOut();
    });

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('tabFeedAll').style.fontWeight = tab === 'all' ? 'bold' : 'normal';
      document.getElementById('tabFeedFriends').style.fontWeight = tab === 'friends' ? 'bold' : 'normal';
      document.getElementById('tabFeedGroups').style.fontWeight = tab === 'groups' ? 'bold' : 'normal';
      document.getElementById('tabChats').style.fontWeight = tab === 'chats' ? 'bold' : 'normal';

      if (tab === 'chats') {
        feedSection.style.display = 'none';
        chatSection.style.display = 'block';
        urlDisplay.value = 'https://dragonfly-flash.com/im';
        loadUsersForChat();
      } else {
        feedSection.style.display = 'block';
        chatSection.style.display = 'none';
        urlDisplay.value = `https://dragonfly-flash.com/feed/${tab}`;
        loadFeed();
      }
    }

    document.getElementById('tabFeedAll').addEventListener('click', () => setTab('all'));
    document.getElementById('tabFeedFriends').addEventListener('click', () => setTab('friends'));
    document.getElementById('tabFeedGroups').addEventListener('click', () => setTab('groups'));
    document.getElementById('tabChats').addEventListener('click', () => setTab('chats'));

    async function loadFeed() {
      if (!currentUser) return;
      feedList.innerHTML = 'Загрузка записей...';

      let query = sbClient.from('posts').select('*').order('id', { ascending: false }).limit(25);

      if (currentTab === 'all') {
        feedTitle.innerText = 'Общая хроника';
      } else if (currentTab === 'groups') {
        feedTitle.innerText = 'Лента сообществ';
        query = query.not('community_id', 'is', null);
      } else if (currentTab === 'friends') {
        feedTitle.innerText = 'Лента друзей';
        const { data: friends } = await sbClient.from('friendships').select('friend_id').eq('user_id', currentUser.id);
        const ids = friends ? friends.map(f => f.friend_id) : [];
        ids.push(currentUser.id);
        query = query.in('user_id', ids);
      }

      const { data: posts, error } = await query;
      if (error) {
        feedList.innerHTML = '<p style="color:red">Ошибка: ' + error.message + '</p>';
        return;
      }

      if (!posts || posts.length === 0) {
        feedList.innerHTML = '<p>Записей в этой ленте пока нет.</p>';
        return;
      }

      feedList.innerHTML = posts.map(p => `
        <div class="post-box">
          <div class="post-author">
            <span>${p.community_id ? '🏛 [Сообщество] ' : ''}${escapeHtml(p.author)}</span>
            <span style="font-size:10px; color:#777;">${new Date(p.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
          </div>
          <div>${escapeHtml(p.content)}</div>
        </div>
      `).join('');
    }

    document.getElementById('sendPostBtn').addEventListener('click', async () => {
      const text = postText.value.trim();
      if (!text || !currentUser) return;

      const newPost = {
        author: currentUser.email.split('@')[0],
        content: text,
        user_id: currentUser.id,
        community_id: postIsGroup.checked ? 1 : null
      };

      await sbClient.from('posts').insert([newPost]);
      postText.value = '';
      postIs
