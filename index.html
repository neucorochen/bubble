<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bubble — Убежище от интернета</title>
  <link rel="stylesheet" href="https://unpkg.com/xp.css/dist/XP.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #004e98 url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: "Tahoma", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .desktop {
      flex: 1;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 12px;
    }
    .auth-window {
      width: 350px;
      max-width: 100%;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }
    .ie-window {
      width: 940px;
      max-width: 98vw;
      height: 680px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .address-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      background: #ece9d8;
      border-bottom: 1px solid #aca899;
      font-size: 11px;
    }
    .address-bar input {
      flex: 1;
      font-size: 11px;
      min-width: 0;
    }
    .btn-mobile-menu {
      display: none;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .window-body-layout {
      flex: 1;
      display: flex;
      background: #fff;
      overflow: hidden;
      margin: 0 !important;
      padding: 0 !important;
      position: relative;
    }
    .sidebar {
      width: 180px;
      background: #ece9d8;
      border-right: 2px groove #fff;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      transition: transform 0.25s ease-out;
      z-index: 100;
    }
    .sidebar button {
      width: 100%;
      text-align: left;
      font-size: 11px;
      cursor: pointer;
    }
    .sidebar-backdrop {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 90;
    }
    .main-view {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      scroll-behavior: smooth;
    }
    .post-box {
      background: #fbfbfb;
      border: 1px solid #7f9db9;
      padding: 8px 12px;
      margin-bottom: 12px;
      position: relative;
      transition: background 0.3s, border-color 0.3s;
    }
    .post-box.highlight {
      border: 2px solid #0055ea !important;
      background: #edf4ff !important;
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .author-info {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .author-info:hover .post-author {
      text-decoration: underline;
    }
    .post-author {
      font-weight: bold;
      color: #0b388f;
    }
    .avatar-mini {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #7f9db9;
      background: #eee;
    }
    .profile-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f4f4f4;
      padding: 10px;
      border: 1px solid #aca899;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .profile-avatar-big {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #0055ea;
      background: #fff;
    }
    .btn-delete-post {
      background: none;
      border: 1px solid #c0c0c0;
      color: #a00;
      cursor: pointer;
      font-size: 10px;
      padding: 1px 4px;
    }
    .btn-delete-post:hover {
      background: #ffe6e6;
    }
    .post-image {
      max-width: 100%;
      max-height: 350px;
      display: block;
      margin: 8px 0;
      border: 1px solid #aca899;
      object-fit: contain;
    }
    .post-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed #dcdcdc;
      flex-wrap: wrap;
    }

    /* Плавное раскрытие блока комментариев */
    .comments-section {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease-out, opacity 0.2s ease-out, margin-top 0.25s ease-out;
      opacity: 0;
      margin-top: 0;
      background: #f0f0f0;
      border-left: 2px solid #0055ea;
      overflow: hidden;
    }
    .comments-section.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 8px;
    }
    .comments-inner {
      min-height: 0;
      padding: 0 10px;
      transition: padding 0.25s ease-out;
    }
    .comments-section.open .comments-inner {
      padding: 6px 10px;
    }
    .comment-item {
      font-size: 11px;
      margin-bottom: 6px;
      border-bottom: 1px dotted #ccc;
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .comment-content {
      word-break: break-word;
    }
    .comment-content b {
      color: #2b579a;
      cursor: pointer;
    }
    .comment-content b:hover {
      text-decoration: underline;
    }
    .comment-controls {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn-comment-del {
      border: none;
      background: transparent;
      color: #b00;
      font-size: 12px;
      line-height: 12px;
      cursor: pointer;
      padding: 0 3px;
      font-weight: bold;
    }
    .btn-comment-reply {
      border: none;
      background: transparent;
      color: #0055ea;
      font-size: 10px;
      cursor: pointer;
      padding: 0 2px;
      text-decoration: underline;
    }
    .notification-item {
      font-size: 11px;
      padding: 8px 10px;
      background: #fbfbfb;
      border: 1px solid #7f9db9;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .notification-item:hover {
      background: #edf4ff;
    }
    .badge {
      background: #d90000;
      color: white;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 9px;
      margin-left: 4px;
      font-weight: bold;
    }
    .taskbar {
      height: 30px;
      background: linear-gradient(to bottom, #245edb 0%, #3f8cf3 9%, #245edb 18%, #1941a5 92%, #1941a5 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
      flex-shrink: 0;
    }
    .start-button {
      height: 100%;
      background: linear-gradient(to bottom, #388e3c 0%, #4caf50 10%, #2e7d32 100%);
      border: none;
      color: white;
      font-weight: bold;
      font-style: italic;
      padding: 0 14px;
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      cursor: pointer;
    }
    .tray {
      background: #0f8fee;
      height: 100%;
      padding: 0 12px;
      display: flex;
      align-items: center;
      color: white;
      font-size: 11px;
    }

    /* Адаптивные стили для мобильных устройств */
    @media (max-width: 768px) {
      .desktop {
        padding: 0;
      }
      .ie-window {
        width: 100vw;
        max-width: 100vw;
        height: 100%;
        max-height: 100%;
        border-radius: 0;
        border: none;
      }
      .btn-mobile-menu {
        display: inline-block;
      }
      .sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 220px;
        transform: translateX(-100%);
        box-shadow: 2px 0 10px rgba(0,0,0,0.4);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar-backdrop.open {
        display: block;
      }
      .post-box {
        padding: 6px 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Окно логина / регистрации -->
  <div class="modal-overlay" id="authModal">
    <div class="window auth-window">
      <div class="title-bar">
        <div class="title-bar-text">Bubble — Вход / Регистрация</div>
      </div>
      <div class="window-body">
        <div style="margin-bottom: 6px;">
          <label style="display:block; font-size:11px;">Никнейм:</label>
          <input type="text" id="inputUsername" placeholder="BubbleUser" style="width: 100%;">
        </div>
        <div style="margin-bottom: 6px;">
          <label style="display:block; font-size:11px;">Электронная почта:</label>
          <input type="email" id="inputEmail" placeholder="user@mail.com" style="width: 100%;">
        </div>
        <div style="margin-bottom: 10px;">
          <label style="display:block; font-size:11px;">Пароль (от 6 символов):</label>
          <input type="password" id="inputPass" placeholder="******" style="width: 100%;">
        </div>
        <div style="display: flex; justify-content: space-between;">
          <button id="btnActionLogin" type="button" style="font-weight: bold;">Войти</button>
          <button id="btnActionRegister" type="button">Регистрация</button>
        </div>
        <div id="authStatus" style="color:red; font-size:11px; margin-top:8px; min-height: 14px;"></div>
      </div>
    </div>
  </div>

  <!-- Главное окно ОС / Браузера -->
  <div class="desktop">
    <div class="window ie-window">
      <div class="title-bar">
        <div class="title-bar-text">Bubble — Убежище от интернета — Microsoft Internet Explorer</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>

      <div class="address-bar">
        <!-- Кнопка вызова выдвижного меню для мобильных -->
        <button class="btn-mobile-menu" id="btnToggleSidebar">📁 Меню</button>
        <span>Address:</span>
        <input type="text" id="urlInput" value="https://bubble.net/feed/all" readonly>
        <button style="min-width: 36px;" id="btnGoReload">Go</button>
      </div>

      <div class="window-body window-body-layout">
        <!-- Затемнение при открытой шторке меню на телефоне -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- Выдвижная боковая панель -->
        <div class="sidebar" id="sidebarPanel">
          <fieldset style="padding: 4px; margin-bottom: 6px;">
            <legend>Сессия</legend>
            <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
              <img id="sideAvatar" src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png" class="avatar-mini" alt="avatar">
              <div id="sideUserName" style="font-size: 11px; font-weight:bold; color:#0055ea; word-break: break-all;">...</div>
            </div>
            <button id="btnLogout" type="button">Выйти</button>
          </fieldset>

          <button id="btnTabFeed" type="button" style="font-weight: bold;">📰 Общая лента</button>
          <button id="btnTabNotifications" type="button">🔔 Уведомления <span id="notifBadge" class="badge" style="display:none;">0</span></button>
          <button id="btnTabProfile" type="button">👤 Мой профиль</button>
        </div>

        <div class="main-view" id="mainContainer">
          <!-- Раздел: Лента -->
          <div id="sectionFeed">
            <fieldset style="margin-bottom: 12px;" id="boxCreatePost">
              <legend>Новая запись на стену</legend>
              <textarea id="postContent" rows="3" style="width: 100%; box-sizing: border-box;" placeholder="Что нового в Bubble? (упоминания через @никнейм)"></textarea>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; flex-wrap: wrap; gap: 6px;">
                <label style="font-size: 11px; cursor: pointer;">
                  📷 Прикрепить фото:
                  <input type="file" id="postImageFile" accept="image/*" style="font-size: 11px;">
                </label>
                <button id="btnCreatePost" type="button" style="font-weight: bold;">Опубликовать</button>
              </div>
              <div id="uploadStatus" style="font-size: 10px; color: #444; margin-top: 2px;"></div>
            </fieldset>

            <fieldset>
              <legend>Общая лента записей Bubble</legend>
              <div id="feedList">Загрузка постов...</div>
            </fieldset>
          </div>

          <!-- Раздел: Уведомления -->
          <div id="sectionNotifications" style="display:none;">
            <fieldset>
              <legend>Уведомления</legend>
              <div id="notificationsList">Загрузка уведомлений...</div>
            </fieldset>
          </div>

          <!-- Раздел: Профиль -->
          <div id="sectionProfile" style="display:none;">
            <div class="profile-card">
              <img id="profileAvatar" src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png" class="profile-avatar-big" alt="avatar">
              <div style="flex:1; min-width: 160px;">
                <div style="font-size:16px; font-weight:bold; color:#0b388f;" id="profileNick">...</div>
                
                <div id="avatarUploadBox" style="margin-top:6px; display:none;">
                  <label style="font-size:11px; cursor:pointer;">
                    Сменить аватар:
                    <input type="file" id="avatarFileInput" accept="image/*" style="font-size:10px;">
                  </label>
                  <span id="avatarStatus" style="font-size:10px; color:#555;"></span>
                </div>
              </div>
            </div>

            <fieldset>
              <legend id="profilePostsLegend">Публикации пользователя</legend>
              <div id="profilePostsList">Загрузка записей...</div>
            </fieldset>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="taskbar">
    <button class="start-button">start</button>
    <div class="tray" id="clock">12:00</div>
  </div>

  <script>
    // 1. Инициализация глобального клиента Supabase
    window.SUPABASE_URL = 'https://gcebeebtccfzmpflztee.supabase.co';
    window.SUPABASE_ANON_KEY = 'sb_publishable_dtbIcBYG7yK2hbB-8a8tGw_9ceJUZ0X';
    window.sbClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    let activeUser = null;
    let currentTab = 'feed';
    let viewingUserId = null;
    let userLikedPosts = new Set();
    let userLikedComments = new Set();
    let profilesMap = {};
    let realtimeChannel = null;

    const DEFAULT_AVATAR = 'https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png';

    // Элементы интерфейса
    const authModal = document.getElementById('authModal');
    const authStatus = document.getElementById('authStatus');
    const inputUsername = document.getElementById('inputUsername');
    const inputEmail = document.getElementById('inputEmail');
    const inputPass = document.getElementById('inputPass');

    const sideUserName = document.getElementById('sideUserName');
    const sideAvatar = document.getElementById('sideAvatar');
    const urlInput = document.getElementById('urlInput');

    const sidebarPanel = document.getElementById('sidebarPanel');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    const btnToggleSidebar = document.getElementById('btnToggleSidebar');

    const btnTabFeed = document.getElementById('btnTabFeed');
    const btnTabNotifications = document.getElementById('btnTabNotifications');
    const btnTabProfile = document.getElementById('btnTabProfile');
    const notifBadge = document.getElementById('notifBadge');

    const sectionFeed = document.getElementById('sectionFeed');
    const sectionNotifications = document.getElementById('sectionNotifications');
    const sectionProfile = document.getElementById('sectionProfile');

    const feedList = document.getElementById('feedList');
    const profilePostsList = document.getElementById('profilePostsList');
    const notificationsList = document.getElementById('notificationsList');

    const profileNick = document.getElementById('profileNick');
    const profileAvatar = document.getElementById('profileAvatar');
    const avatarUploadBox = document.getElementById('avatarUploadBox');
    const avatarFileInput = document.getElementById('avatarFileInput');
    const avatarStatus = document.getElementById('avatarStatus');
    const profilePostsLegend = document.getElementById('profilePostsLegend');

    const postContent = document.getElementById('postContent');
    const postImageFile = document.getElementById('postImageFile');
    const btnCreatePost = document.getElementById('btnCreatePost');
    const uploadStatus = document.getElementById('uploadStatus');

    // Управление мобильной шторкой меню
    function toggleMobileMenu(forceClose = false) {
      if (forceClose) {
        sidebarPanel.classList.remove('open');
        sidebarBackdrop.classList.remove('open');
      } else {
        sidebarPanel.classList.toggle('open');
        sidebarBackdrop.classList.toggle('open');
      }
    }

    btnToggleSidebar.addEventListener('click', () => toggleMobileMenu());
    sidebarBackdrop.addEventListener('click', () => toggleMobileMenu(true));

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    function getUserName(user) {
      if (!user) return 'Аноним';
      return user.user_metadata?.username || (user.email ? user.email.split('@')[0] : 'Аноним');
    }

    async function ensureProfile(user) {
      if (!user) return;
      try {
        const nick = getUserName(user);
        const { data } = await window.sbClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
        if (!data) {
          await window.sbClient.from('profiles').insert([{
            id: user.id,
            username: nick,
            avatar_url: DEFAULT_AVATAR
          }]);
        }
      } catch (e) {
        console.warn('ensureProfile:', e);
      }
    }

    async function loadAllProfiles() {
      try {
        const { data } = await window.sbClient.from('profiles').select('*');
        profilesMap = {};
        (data || []).forEach(p => {
          profilesMap[p.id] = {
            username: p.username || 'Аноним',
            avatar_url: p.avatar_url || DEFAULT_AVATAR
          };
        });
      } catch (e) {
        console.warn('loadAllProfiles:', e);
      }
    }

    async function updateSessionState(session) {
      activeUser = session ? session.user : null;
      if (activeUser) {
        authModal.style.display = 'none';
        await ensureProfile(activeUser);
        await loadAllProfiles();

        const myProf = profilesMap[activeUser.id];
        sideUserName.innerText = myProf ? myProf.username : getUserName(activeUser);
        sideAvatar.src = (myProf && myProf.avatar_url) ? myProf.avatar_url : DEFAULT_AVATAR;

        await loadUserLikes();
        await updateUnreadBadge();
        initRealtimeNotifications();
        switchTab('feed');
      } else {
        authModal.style.display = 'flex';
        if (realtimeChannel) {
          window.sbClient.removeChannel(realtimeChannel);
          realtimeChannel = null;
        }
      }
    }

    window.sbClient.auth.getSession().then(({ data: { session } }) => updateSessionState(session));
    window.sbClient.auth.onAuthStateChange((_, session) => updateSessionState(session));

    // Авторизация
    document.getElementById('btnActionRegister').addEventListener('click', async () => {
      authStatus.style.color = '#333';
      authStatus.innerText = 'Создание...';
      const username = inputUsername.value.trim();
      const email = inputEmail.value.trim();
      const password = inputPass.value.trim();

      if (!username || !email || !password) return authStatus.innerText = 'Заполните все поля!';
      if (password.length < 6) return authStatus.innerText = 'Пароль от 6 символов!';

      const { data, error } = await window.sbClient.auth.signUp({
        email, password, options: { data: { username } }
      });
      if (error) {
        authStatus.style.color = 'red';
        authStatus.innerText = error.message;
      } else if (data.session) {
        updateSessionState(data.session);
      } else {
        authStatus.style.color = 'green';
        authStatus.innerText = 'Создано! Нажмите «Войти».';
      }
    });

    document.getElementById('btnActionLogin').addEventListener('click', async () => {
      authStatus.style.color = '#333';
      authStatus.innerText = 'Проверка...';
      const email = inputEmail.value.trim();
      const password = inputPass.value.trim();
      if (!email || !password) return authStatus.innerText = 'Введите почту и пароль!';

      const { data, error } = await window.sbClient.auth.signInWithPassword({ email, password });
      if (error) {
        authStatus.style.color = 'red';
        authStatus.innerText = error.message;
      } else {
        updateSessionState(data.session);
      }
    });

    document.getElementById('btnLogout').addEventListener('click', () => window.sbClient.auth.signOut());

    async function updateUnreadBadge() {
      if (!activeUser) return;
      try {
        const { data } = await window.sbClient
          .from('notifications')
          .select('id')
          .eq('user_id', activeUser.id)
          .eq('is_read', false);

        const count = (data || []).length;
        if (count > 0) {
          notifBadge.style.display = 'inline-block';
          notifBadge.innerText = count;
        } else {
          notifBadge.style.display = 'none';
        }
      } catch (e) {
        console.warn('updateUnreadBadge:', e);
      }
    }

    function initRealtimeNotifications() {
      if (!activeUser) return;
      if (realtimeChannel) {
        window.sbClient.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }
      realtimeChannel = window.sbClient
        .channel('user_notifications_' + activeUser.id)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'notifications',
          filter: `user_id=eq.${activeUser.id}`
        }, () => {
          updateUnreadBadge();
          if (currentTab === 'notifications') {
            loadNotifications();
          }
        })
        .subscribe();
    }

    async function createNotification(targetUserId, type, message, postId) {
      if (!targetUserId || !activeUser || targetUserId === activeUser.id) return;
      try {
        const myProf = profilesMap[activeUser.id] || {};
        const senderNick = myProf.username || getUserName(activeUser);

        await window.sbClient.from('notifications').insert([{
          user_id: targetUserId,
          from_user_id: activeUser.id,
          from_username: senderNick,
          type,
          message,
          post_id: postId,
          is_read: false
        }]);
      } catch (e) {
        console.warn('createNotification:', e);
      }
    }

    async function parseMentions(text, postId) {
      try {
        const matches = text.match(/@([a-zA-Z0-9_\u0400-\u04FF\-]+)/g);
        if (!matches) return;
        const rawUsernames = matches.map(m => m.replace('@', '').toLowerCase());

        const { data: profiles } = await window.sbClient.from('profiles').select('id, username');
        if (profiles) {
          for (const p of profiles) {
            if (rawUsernames.includes(p.username.toLowerCase())) {
              await createNotification(p.id, 'mention', `упомянул(а) вас: "${text.substring(0, 45)}..."`, postId);
            }
          }
        }
      } catch (e) {
        console.warn('parseMentions:', e);
      }
    }

    function switchTab(tab, targetUserId = null) {
      currentTab = tab;
      toggleMobileMenu(true); // Закрываем меню на телефоне при переходе

      btnTabFeed.style.fontWeight = tab === 'feed' ? 'bold' : 'normal';
      btnTabNotifications.style.fontWeight = tab === 'notifications' ? 'bold' : 'normal';
      btnTabProfile.style.fontWeight = (tab === 'profile' && activeUser && targetUserId === activeUser.id) ? 'bold' : 'normal';

      sectionFeed.style.display = tab === 'feed' ? 'block' : 'none';
      sectionNotifications.style.display = tab === 'notifications' ? 'block' : 'none';
      sectionProfile.style.display = tab === 'profile' ? 'block' : 'none';

      if (tab === 'feed') {
        urlInput.value = 'https://bubble.net/feed/all';
        loadFeed();
      } else if (tab === 'notifications') {
        urlInput.value = 'https://bubble.net/notifications';
        loadNotifications();
      } else if (tab === 'profile') {
        viewingUserId = targetUserId || (activeUser ? activeUser.id : null);
        if (viewingUserId) openUserProfile(viewingUserId);
      }
    }

    btnTabFeed.addEventListener('click', () => switchTab('feed'));
    btnTabNotifications.addEventListener('click', () => switchTab('notifications'));
    btnTabProfile.addEventListener('click', () => {
      if (activeUser) switchTab('profile', activeUser.id);
    });
    document.getElementById('btnGoReload').addEventListener('click', () => switchTab(currentTab, viewingUserId));

    window.goToProfile = function(userId) {
      switchTab('profile', userId);
    };

    async function loadUserLikes() {
      if (!activeUser) return;
      try {
        const { data: pLikes } = await window.sbClient.from('post_likes').select('post_id').eq('user_id', activeUser.id);
        userLikedPosts = new Set((pLikes || []).map(l => l.post_id));

        const { data: cLikes } = await window.sbClient.from('comment_likes').select('comment_id').eq('user_id', activeUser.id);
        userLikedComments = new Set((cLikes || []).map(l => l.comment_id));
      } catch (e) {
        console.warn('loadUserLikes:', e);
      }
    }

    // Карточка поста с разделением контекста ('feed' или 'profile')
    function renderPostItem(p, commentsByPost, context = 'feed') {
      const isPostLiked = userLikedPosts.has(p.id);
      const postComments = commentsByPost[p.id] || [];
      const currentUserId = activeUser ? activeUser.id : null;
      const isMyPost = currentUserId && p.user_id === currentUserId;
      const prof = profilesMap[p.user_id] || { username: p.author, avatar_url: DEFAULT_AVATAR };

      const uniquePostKey = `${context}-${p.id}`;

      return `
        <div class="post-box" id="post-${uniquePostKey}">
          <div class="post-header">
            <div class="author-info" onclick="goToProfile('${p.user_id}')">
              <img src="${prof.avatar_url}" class="avatar-mini" alt="avatar">
              <span class="post-author">🫧 ${escapeHtml(prof.username)}</span>
              <span style="font-size:10px; color:#777; margin-left:4px;">${new Date(p.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
            ${isMyPost ? `<button class="btn-delete-post" onclick="deletePost(${p.id})">✖ Удалить</button>` : ''}
          </div>

          <div style="margin: 6px 0; word-break: break-word;">${escapeHtml(p.content)}</div>
          ${p.image_url ? `<img src="${p.image_url}" class="post-image" alt="Вложение">` : ''}

          <div class="post-actions">
            <button onclick="togglePostLike(${p.id}, ${p.likes_count || 0}, '${p.user_id}')">
              ${isPostLiked ? '❤️' : '🤍'} ${p.likes_count || 0}
            </button>
            <button onclick="toggleCommentsVisibility('${uniquePostKey}')" style="font-size:11px;">
              💬 Комментарии (${postComments.length})
            </button>
          </div>

          <!-- Плавный аккордеон комментариев -->
          <div class="comments-section" id="comments-box-${uniquePostKey}">
            <div class="comments-inner">
              <div id="comments-list-${uniquePostKey}">
                ${postComments.map(c => {
                  const isCommentLiked = userLikedComments.has(c.id);
                  const isMyComment = currentUserId && c.user_id === currentUserId;
                  const cProf = profilesMap[c.user_id] || { username: c.author, avatar_url: DEFAULT_AVATAR };

                  return `
                    <div class="comment-item" id="comment-${c.id}">
                      <div class="comment-content">
                        <b onclick="goToProfile('${c.user_id}')">${escapeHtml(cProf.username)}:</b> ${escapeHtml(c.content)}
                      </div>
                      <div class="comment-controls">
                        <button onclick="toggleCommentLike(${c.id}, ${c.likes_count || 0}, '${c.user_id}', ${p.id})" style="font-size:10px; padding:1px 4px;">
                          ${isCommentLiked ? '❤️' : '🤍'} ${c.likes_count || 0}
                        </button>
                        <button class="btn-comment-reply" onclick="replyToComment('${uniquePostKey}', '${escapeHtml(cProf.username)}')">ответить</button>
                        ${isMyComment ? `<button class="btn-comment-del" title="Удалить" onclick="deleteComment(${c.id})">×</button>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
              <div style="display:flex; gap:4px; margin-top:6px;">
                <input type="text" id="comment-input-${uniquePostKey}" placeholder="Написать комментарий..." style="flex:1; font-size:11px;">
                <button onclick="sendComment(${p.id}, '${p.user_id}', '${uniquePostKey}')" style="font-size:11px;">Ответить</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function loadFeed() {
      if (!activeUser) return;
      feedList.innerHTML = 'Загрузка записей...';
      await loadAllProfiles();

      const { data: posts, error } = await window.sbClient
        .from('posts')
        .select('*')
        .order('id', { ascending: false })
        .limit(30);

      if (error) return feedList.innerHTML = '<p style="color:red">Ошибка: ' + error.message + '</p>';
      if (!posts || posts.length === 0) return feedList.innerHTML = '<p>Пока нет записей. Оставьте первое сообщение!</p>';

      const postIds = posts.map(p => p.id);
      const { data: comments } = await window.sbClient.from('comments').select('*').in('post_id', postIds).order('id', { ascending: true });

      const commentsByPost = {};
      (comments || []).forEach(c => {
        if (!commentsByPost[c.post_id]) commentsByPost[c.post_id] = [];
        commentsByPost[c.post_id].push(c);
      });

      feedList.innerHTML = posts.map(p => renderPostItem(p, commentsByPost, 'feed')).join('');
    }

    async function openUserProfile(userId) {
      await loadAllProfiles();
      const prof = profilesMap[userId] || { username: 'Пользователь', avatar_url: DEFAULT_AVATAR };

      profileNick.innerText = prof.username;
      profileAvatar.src = prof.avatar_url || DEFAULT_AVATAR;
      urlInput.value = `https://bubble.net/user/${prof.username}`;

      if (activeUser && userId === activeUser.id) {
        avatarUploadBox.style.display = 'block';
        profilePostsLegend.innerText = 'Мои публикации';
      } else {
        avatarUploadBox.style.display = 'none';
        profilePostsLegend.innerText = `Публикации пользователя ${prof.username}`;
      }

      profilePostsList.innerHTML = 'Загрузка записей...';
      const { data: posts, error } = await window.sbClient
        .from('posts')
        .select('*')
        .eq('user_id', userId)
        .order('id', { ascending: false });

      if (error) return profilePostsList.innerHTML = '<p style="color:red">Ошибка: ' + error.message + '</p>';
      if (!posts || posts.length === 0) return profilePostsList.innerHTML = '<p>Публикаций пока нет.</p>';

      const postIds = posts.map(p => p.id);
      const { data: comments } = await window.sbClient.from('comments').select('*').in('post_id', postIds).order('id', { ascending: true });

      const commentsByPost = {};
      (comments || []).forEach(c => {
        if (!commentsByPost[c.post_id]) commentsByPost[c.post_id] = [];
        commentsByPost[c.post_id].push(c);
      });

      profilePostsList.innerHTML = posts.map(p => renderPostItem(p, commentsByPost, 'profile')).join('');
    }

    async function loadNotifications() {
      if (!activeUser) return;
      notificationsList.innerHTML = 'Загрузка...';

      const { data: notifs, error } = await window.sbClient
        .from('notifications')
        .select('*')
        .eq('user_id', activeUser.id)
        .order('id', { ascending: false })
        .limit(40);

      if (error) return notificationsList.innerHTML = '<p style="color:red">Ошибка: ' + error.message + '</p>';
      if (!notifs || notifs.length === 0) return notificationsList.innerHTML = '<p>Уведомлений пока нет.</p>';

      notificationsList.innerHTML = notifs.map(n => `
        <div class="notification-item" onclick="openTargetPost(${n.post_id}, ${n.id})" style="${n.is_read ? 'opacity:0.75;' : 'background:#fff8db; font-weight:bold; border-color:#d49b00;'}">
          <div><b>${escapeHtml(n.from_username)}</b> ${escapeHtml(n.message)}</div>
          <span style="font-size:9px; color:#888;">${new Date(n.created_at).toLocaleString()}</span>
        </div>
      `).join('');
    }

    window.openTargetPost = async function(postId, notifId) {
      if (notifId && activeUser) {
        await window.sbClient.from('notifications').update({ is_read: true }).eq('id', notifId);
        await updateUnreadBadge();
      }

      switchTab('feed');

      setTimeout(() => {
        const postEl = document.getElementById(`post-feed-${postId}`);
        if (postEl) {
          postEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          postEl.classList.add('highlight');
          setTimeout(() => postEl.classList.remove('highlight'), 2500);

          const commentsBox = document.getElementById(`comments-box-feed-${postId}`);
          if (commentsBox && !commentsBox.classList.contains('open')) {
            commentsBox.classList.add('open');
          }
        }
      }, 500);
    };

    avatarFileInput.addEventListener('change', async () => {
      const file = avatarFileInput.files[0];
      if (!file || !activeUser) return;

      avatarStatus.innerText = 'Загрузка...';
      const fileExt = file.name.split('.').pop();
      const fileName = `${activeUser.id}_${Date.now()}.${fileExt}`;

      const { error: uploadError } = await window.sbClient.storage.from('avatars').upload(fileName, file);
      if (uploadError) {
        avatarStatus.innerText = '';
        return alert('Ошибка загрузки: ' + uploadError.message);
      }

      const { data: { publicUrl } } = window.sbClient.storage.from('avatars').getPublicUrl(fileName);

      await window.sbClient.from('profiles').update({ avatar_url: publicUrl }).eq('id', activeUser.id);

      avatarStatus.innerText = 'Готово!';
      profileAvatar.src = publicUrl;
      sideAvatar.src = publicUrl;
      avatarFileInput.value = '';
      await loadAllProfiles();
    });

    window.toggleCommentsVisibility = function(uniquePostKey) {
      const box = document.getElementById(`comments-box-${uniquePostKey}`);
      if (!box) return;
      box.classList.toggle('open');
    };

    window.replyToComment = function(uniquePostKey, author) {
      const box = document.getElementById(`comments-box-${uniquePostKey}`);
      if (box && !box.classList.contains('open')) {
        box.classList.add('open');
      }
      const input = document.getElementById(`comment-input-${uniquePostKey}`);
      if (input) {
        input.value = `@${author} ` + input.value;
        input.focus();
      }
    };

    btnCreatePost.addEventListener('click', async () => {
      if (!activeUser) return;
      const text = postContent.value.trim();
      const file = postImageFile.files[0];
      if (!text && !file) return alert('Введите текст или прикрепите фото!');

      btnCreatePost.disabled = true;
      let imageUrl = null;

      if (file) {
        uploadStatus.innerText = 'Загрузка фото...';
        const fileExt = file.name.split('.').pop();
        const fileName = `${activeUser.id}_${Date.now()}.${fileExt}`;
        const { error: uploadError } = await window.sbClient.storage.from('post_images').upload(fileName, file);
        if (uploadError) {
          uploadStatus.innerText = '';
          btnCreatePost.disabled = false;
          return alert('Ошибка фото: ' + uploadError.message);
        }
        const { data: { publicUrl } } = window.sbClient.storage.from('post_images').getPublicUrl(fileName);
        imageUrl = publicUrl;
      }

      uploadStatus.innerText = 'Публикация...';
      const myProf = profilesMap[activeUser.id] || {};
      const { data: insertedPost, error } = await window.sbClient.from('posts').insert([{
        author: myProf.username || getUserName(activeUser),
        content: text,
        user_id: activeUser.id,
        image_url: imageUrl,
        likes_count: 0
      }]).select().single();

      btnCreatePost.disabled = false;
      uploadStatus.innerText = '';

      if (error) {
        alert('Ошибка: ' + error.message);
      } else {
        postContent.value = '';
        postImageFile.value = '';
        if (insertedPost) await parseMentions(text, insertedPost.id);
        switchTab(currentTab, viewingUserId);
      }
    });

    window.deletePost = async function(postId) {
      if (!activeUser || !confirm('Удалить этот пост?')) return;
      const { error } = await window.sbClient.from('posts').delete().match({ id: postId, user_id: activeUser.id });
      if (error) alert('Ошибка удаления: ' + error.message);
      else switchTab(currentTab, viewingUserId);
    };

    window.deleteComment = async function(commentId) {
      if (!activeUser || !confirm('Удалить комментарий?')) return;
      const { error } = await window.sbClient.from('comments').delete().match({ id: commentId, user_id: activeUser.id });
      if (error) alert('Ошибка удаления: ' + error.message);
      else switchTab(currentTab, viewingUserId);
    };

    window.togglePostLike = async function(postId, currentLikes, postAuthorId) {
      if (!activeUser) return;
      if (userLikedPosts.has(postId)) {
        await window.sbClient.from('post_likes').delete().match({ post_id: postId, user_id: activeUser.id });
        await window.sbClient.from('posts').update({ likes_count: Math.max(0, currentLikes - 1) }).eq('id', postId);
        userLikedPosts.delete(postId);
      } else {
        await window.sbClient.from('post_likes').insert([{ post_id: postId, user_id: activeUser.id }]);
        await window.sbClient.from('posts').update({ likes_count: currentLikes + 1 }).eq('id', postId);
        userLikedPosts.add(postId);
        await createNotification(postAuthorId, 'like_post', 'поставил(а) ❤️ вашему посту', postId);
      }
      switchTab(currentTab, viewingUserId);
    };

    window.toggleCommentLike = async function(commentId, currentLikes, commentAuthorId, postId) {
      if (!activeUser) return;
      if (userLikedComments.has(commentId)) {
        await window.sbClient.from('comment_likes').delete().match({ comment_id: commentId, user_id: activeUser.id });
        await window.sbClient.from('comments').update({ likes_count: Math.max(0, currentLikes - 1) }).eq('id', commentId);
        userLikedComments.delete(commentId);
      } else {
        await window.sbClient.from('comment_likes').insert([{ comment_id: commentId, user_id: activeUser.id }]);
        await window.sbClient.from('comments').update({ likes_count: currentLikes + 1 }).eq('id', commentId);
        userLikedComments.add(commentId);
        await createNotification(commentAuthorId, 'like_comment', 'поставил(а) ❤️ вашему комментарию', postId);
      }
      switchTab(currentTab, viewingUserId);
    };

    window.sendComment = async function(postId, postAuthorId, uniquePostKey) {
      if (!activeUser) return;
      const input = document.getElementById(`comment-input-${uniquePostKey}`);
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const myProf = profilesMap[activeUser.id] || {};
      const { error } = await window.sbClient.from('comments').insert([{
        post_id: postId,
        user_id: activeUser.id,
        author: myProf.username || getUserName(activeUser),
        content: text,
        likes_count: 0
      }]);

      if (error) {
        alert('Ошибка комментария: ' + error.message);
      } else {
        if (input) input.value = '';
        await createNotification(postAuthorId, 'reply_comment', `прокомментировал(а) ваш пост: "${text.substring(0, 30)}..."`, postId);
        await parseMentions(text, postId);
        switchTab(currentTab, viewingUserId);
      }
    };

    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);
  </script>
</body>
</html>
