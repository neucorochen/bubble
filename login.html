<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>bubble — Вход</title>
  <link rel="stylesheet" href="https://unpkg.com/xp.css/dist/XP.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: #004e98 url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: "Tahoma", sans-serif;
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .auth-window {
      width: 380px; max-width: 95vw;
      box-shadow: 0 10px 30px rgba(0, 40, 110, 0.5);
      border-radius: 8px 8px 0 0;
      overflow: hidden;
    }
    .aero-title-bar {
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(180,225,255,0.85) 45%, rgba(110,190,250,0.85) 50%, rgba(160,220,255,0.95) 100%);
      padding: 7px 12px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.8);
    }
    .aero-title-text {
      font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
      font-size: 14px; font-weight: bold; color: #003366;
      text-shadow: 0 1px 2px rgba(255,255,255,0.9);
      letter-spacing: 0.5px;
    }
    .window-body {
      background: #fbfbfb; padding: 14px; margin: 0 !important;
    }
    .field-group { margin-bottom: 9px; }
    .field-group label {
      display: block; font-size: 11px; font-weight: bold; color: #0b388f; margin-bottom: 3px;
    }
    .field-group input {
      width: 100%; font-size: 12px; padding: 4px 6px;
    }

    /* Стильный блок капчи */
    .captcha-container {
      background: linear-gradient(180deg, #edf7ff 0%, #d8ecff 100%);
      border: 1px solid #7f9db9; border-radius: 6px;
      padding: 8px; margin-bottom: 12px;
      box-shadow: inset 0 1px 0 #ffffff;
    }
    .captcha-row {
      display: flex; align-items: center; gap: 8px; margin-top: 5px;
    }
    #captchaCanvas {
      background: #ffffff; border: 1px solid #7f9db9; border-radius: 4px;
      cursor: pointer; flex-shrink: 0;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.1);
    }
    .btn-refresh-captcha {
      padding: 3px 8px; font-size: 12px; cursor: pointer; height: 38px;
    }
    .auth-actions {
      display: flex; justify-content: space-between; gap: 8px; margin-top: 10px;
    }
    .auth-actions button {
      flex: 1; padding: 6px 0; font-size: 11px; cursor: pointer;
    }
    .status-msg {
      font-size: 11px; margin-top: 8px; min-height: 16px; word-break: break-word; text-align: center;
    }
    .status-msg.error { color: #d90000; font-weight: bold; }
    .status-msg.success { color: #008000; font-weight: bold; }
  </style>
</head>
<body>

  <div class="window auth-window">
    <div class="aero-title-bar">
      <div class="aero-title-text">bubble — Авторизация</div>
    </div>
    <div class="window-body">

      <div class="field-group">
        <label>Никнейм (для регистрации):</label>
        <input type="text" id="inputUsername" placeholder="Polina">
      </div>

      <div class="field-group">
        <label>Электронная почта:</label>
        <input type="email" id="inputEmail" placeholder="user@mail.com">
      </div>

      <div class="field-group">
        <label>Пароль (от 6 символов):</label>
        <input type="password" id="inputPass" placeholder="******">
      </div>

      <!-- Сложная графическая капча -->
      <div class="captcha-container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label style="font-size:11px; font-weight:bold; color:#0b388f; margin:0;">Код с картинки:</label>
          <span style="font-size:10px; color:#666;">(кликните по коду для смены)</span>
        </div>
        <div class="captcha-row">
          <canvas id="captchaCanvas" width="140" height="38" title="Обновить капчу"></canvas>
          <button type="button" class="btn-refresh-captcha" id="btnReloadCaptcha" title="Сгенерировать другой код">🔄</button>
          <input type="text" id="inputCaptcha" placeholder="Символы" maxlength="6" style="flex:1; text-transform:uppercase; font-size:14px; font-weight:bold; letter-spacing:2px; height:38px; text-align:center;">
        </div>
      </div>

      <div class="auth-actions">
        <button type="button" id="btnLogin" style="font-weight: bold;">Войти</button>
        <button type="button" id="btnRegister">Регистрация</button>
      </div>

      <div id="statusBox" class="status-msg"></div>
    </div>
  </div>

  <script>
    window.SUPABASE_URL = 'https://gcebeebtccfzmpflztee.supabase.co';
    window.SUPABASE_ANON_KEY = 'sb_publishable_dtbIcBYG7yK2hbB-8a8tGw_9ceJUZ0X';
    window.sbClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    // Если пользователь уже авторизован, сразу направляем на главную страницу
    window.sbClient.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        window.location.replace('index.html');
      }
    });

    let currentCaptchaText = '';

    // Генерация сложной многослойной капчи с помехами и искажениями
    function generateComplexCaptcha() {
      const canvas = document.getElementById('captchaCanvas');
      const ctx = canvas.getContext('2d');
      // Исключаем визуально двусмысленные символы 0, O, I, 1, l
      const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      let result = '';

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Градиентный шумный фон
      const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      bgGrad.addColorStop(0, '#f2f8ff');
      bgGrad.addColorStop(1, '#e3effb');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Точечный шум (120 случайных разноцветных точек)
      for (let i = 0; i < 120; i++) {
        ctx.fillStyle = `rgba(${Math.floor(Math.random()*150)}, ${Math.floor(Math.random()*150)}, ${Math.floor(Math.random()*200)}, 0.4)`;
        ctx.beginPath();
        ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 1.6, 0, Math.PI * 2);
        ctx.fill();
      }

      // 3. Волнообразные линии помех (кривые Безье)
      for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = `rgba(${Math.floor(Math.random()*120)}, ${Math.floor(Math.random()*120)}, ${Math.floor(Math.random()*200)}, 0.5)`;
        ctx.lineWidth = 1.2 + Math.random() * 1;
        ctx.beginPath();
        ctx.moveTo(0, Math.random() * canvas.height);
        ctx.bezierCurveTo(
          canvas.width / 3, Math.random() * canvas.height,
          (canvas.width / 3) * 2, Math.random() * canvas.height,
          canvas.width, Math.random() * canvas.height
        );
        ctx.stroke();
      }

      // 4. Отрисовка 6 символов под случайным углом и со случайным размером
      const fontFamilies = ['Courier New', 'Georgia', 'Arial', 'Trebuchet MS', 'Verdana'];
      for (let i = 0; i < 6; i++) {
        const char = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        result += char;

        ctx.save();
        const fontSize = 18 + Math.floor(Math.random() * 7);
        const fontName = fontFamilies[Math.floor(Math.random() * fontFamilies.length)];
        ctx.font = `bold ${fontSize}px "${fontName}", monospace`;
        ctx.fillStyle = `rgb(${10 + Math.floor(Math.random()*70)}, ${10 + Math.floor(Math.random()*70)}, ${80 + Math.floor(Math.random()*140)})`;

        const xPos = 12 + i * 20;
        const yPos = 24 + (Math.random() - 0.5) * 8;
        ctx.translate(xPos, yPos);
        ctx.rotate((Math.random() - 0.5) * 0.55); // поворот от -16 до +16 градусов
        ctx.fillText(char, 0, 0);
        ctx.restore();
      }

      currentCaptchaText = result;
      document.getElementById('inputCaptcha').value = '';
    }

    document.getElementById('btnReloadCaptcha').onclick = generateComplexCaptcha;
    document.getElementById('captchaCanvas').onclick = generateComplexCaptcha;
    generateComplexCaptcha();

    const statusBox = document.getElementById('statusBox');
    function setStatus(text, type = 'error') {
      statusBox.className = `status-msg ${type}`;
      statusBox.innerText = text;
    }

    function checkCaptcha() {
      const userVal = document.getElementById('inputCaptcha').value.trim();
      if (!userVal) {
        setStatus('Введите код с картинки капчи!');
        return false;
      }
      // Регистронезависимое сравнение для удобства пользователей
      if (userVal.toLowerCase() !== currentCaptchaText.toLowerCase()) {
        setStatus('Неверный код капчи! Картинка обновлена.');
        generateComplexCaptcha();
        return false;
      }
      return true;
    }

    // Авторизация
    document.getElementById('btnLogin').onclick = async () => {
      const email = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputPass').value.trim();

      setStatus('');
      if (!email || !password) return setStatus('Введите электронную почту и пароль!');
      if (!checkCaptcha()) return;

      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerText = 'Вход...';

      const { data, error } = await window.sbClient.auth.signInWithPassword({ email, password });

      btn.disabled = false;
      btn.innerText = 'Войти';

      if (error) {
        generateComplexCaptcha();
        return setStatus('Ошибка входа: ' + error.message);
      }

      setStatus('Успешный вход! Перенаправление...', 'success');
      setTimeout(() => {
        window.location.replace('index.html');
      }, 400);
    };

    // Регистрация
    document.getElementById('btnRegister').onclick = async () => {
      const email = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputPass').value.trim();
      const username = document.getElementById('inputUsername').value.trim() || email.split('@')[0];

      setStatus('');
      if (!email || !password) return setStatus('Заполните почту и пароль!');
      if (password.length < 6) return setStatus('Пароль должен содержать минимум 6 символов!');
      if (!checkCaptcha()) return;

      const btn = document.getElementById('btnRegister');
      btn.disabled = true;
      btn.innerText = 'Создание...';

      const { data, error } = await window.sbClient.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      btn.disabled = false;
      btn.innerText = 'Регистрация';

      if (error) {
        generateComplexCaptcha();
        return setStatus('Ошибка регистрации: ' + error.message);
      }

      // Создаём запись в профилях, если пользователь успешно создан
      if (data?.user) {
        await window.sbClient.from('profiles').upsert([{
          id: data.user.id,
          username: username,
          avatar_url: 'https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png'
        }]);
      }

      if (data?.session) {
        setStatus('Регистрация завершена! Перенаправление...', 'success');
        setTimeout(() => {
          window.location.replace('index.html');
        }, 400);
      } else {
        setStatus('Аккаунт создан! Теперь нажмите «Войти».', 'success');
        generateComplexCaptcha();
      }
    };
  </script>
</body>
</html>
